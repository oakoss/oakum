[graph]
all-features = true

[advisories]
yanked = "deny"

# Entries are scoped by advisory ID, never by crate, so a real vulnerability in
# the same dependency still fails. `deny` on the unused case makes an entry fail
# once its advisory stops firing, which forces removal instead of leaving a
# stale suppression behind.
unused-ignored-advisory = "deny"

[licenses]
# oakum ships under MIT, so every entry must be compatible with redistributing a
# statically linked binary under that license. The list is deliberately the
# minimum the current graph needs — `unicode-ident` is the only reason
# Unicode-3.0 is here. Adding a license is an accept, so make it one deliberately
# rather than pasting in whatever a new dependency dragged along.
allow = [
  "Apache-2.0",
  "MIT",
  # js-semver (ADR-0026); OSI-approved MIT No Attribution.
  "MIT-0",
  # encoding_rs via serde-saphyr (okm-1t8); OSI-approved BSD-3-Clause.
  "BSD-3-Clause",
  # winx via cap-std (okm-hsk); Apache-2.0 plus LLVM's permissive exception.
  "Apache-2.0 WITH LLVM-exception",
  "Unicode-3.0",
  # rustls / aws-lc via reqwest (okm-dlo); OSI-approved ISC.
  "ISC",
  # webpki-root-certs via reqwest rustls (okm-dlo).
  "CDLA-Permissive-2.0",
]

# Defaults to `warn`, which would let an entry outlive the crate that needed it
# and pre-accept the next dependency that wants it. Same reasoning as
# `unused-ignored-advisory` above.
unused-allowed-license = "deny"

[bans]
multiple-versions = "deny"
wildcards = "allow"

# fs-set-times (cap-std 4.0.3) still pulls io-lifetimes 2.x / windows-sys 0.59 while
# cap-primitives use 3.x / 0.60. Skip until upstream unifies (okm-5b8).
[[bans.skip-tree]]
name = "fs-set-times"
version = "0.20.3"
reason = "cap-std duplicate Windows/io-lifetimes subgraph (okm-5b8)"

# clap derive (syn 2) vs jni (syn 3): no shared parent without dropping a feature (okm-5b8).
[[bans.skip]]
name = "syn"
reason = "clap derive vs jni proc-macro split (okm-5b8)"

[sources]
# oakum publishes to crates.io, npm, and Homebrew, so a dependency resolved from
# anywhere but a known registry is a question about the release path itself.
unknown-registry = "deny"
unknown-git = "deny"
