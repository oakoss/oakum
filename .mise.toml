[tools]
# Every tool here is a single binary from GitHub releases or crates.io, except
# Node: pnpm discovery and ADR-0005 Confirmation (`@changesets/parse`) need a
# runtime on PATH. Formatters stay non-Node (dprint / rumdl).
#
# mise owns the Rust toolchain, components included, so CI installs exactly one
# and `cargo clippy` resolves deterministically.
#
# Exact, not `stable`: `clippy::pedantic` runs under `-D warnings`, so a release
# that adds a lint turns CI red with no commit anyone reviewed. `stable` also
# resolves per-machine and per-install-date, which diverges local from CI.
#
# This version and Cargo.toml's `rust-version` are the same number by decision
# (ADR-0025): oakum supports exactly what it tests. Moving one means moving the
# other, and `renovate.json` keeps this pin out of automerge so that move is
# always reviewed.
rust = { version = "1.97.1", components = "clippy,rustfmt,rust-src,rust-analyzer" }
lefthook = "2.1.10"
dprint = "0.56.0"
rumdl = "0.2.58"
# Discovery shells out to pnpm list / pnpm root -w (okm-qv4). Pin matches the
# version stamped in docs/research/workspace-discovery.md.
pnpm = "11.22.0"
# Exact: `@changesets/parse@1.0.0` engines are `^22.11 || ^24 || >=26`.
node = "24.19.0"
shellcheck = "0.11.0"
# shellcheck covers .sh files; actionlint covers the shell inlined in workflow
# `run:` blocks, which is where the only non-trivial scripting in this repo
# lives.
actionlint = "1.7.12"
# The security tools resolve through aqua, which verifies SHA256/SHA512 on every
# download and checks cosign, SLSA, and GitHub attestations where published.
# That is why they are pinned here rather than curled in a workflow step or
# pulled through cargo-deny-action, whose Dockerfile fetches the binary with no
# checksum at all.
gitleaks = "8.30.1"
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
# aqua, not cargo: the cargo backend compiles cocogitto from source on every
# cold CI cache. Exact, because cog parses commit messages for both the
# commit-msg hook and CI, and a 7.x release could change what either accepts.
"aqua:cocogitto/cocogitto" = "7.0.0"

[tasks.setup]
description = "Bootstrap a fresh clone"
# `bd bootstrap`, not `bd init`. With BD_SYNC_REMOTE in `.beads/.env`,
# bootstrap clones that remote; without it, it creates a fresh local
# database. Either way it leaves core.hooksPath unset and AGENTS.md
# untouched. `bd init` does neither — it sets core.hooksPath
# (making git bypass lefthook silently), rewrites AGENTS.md, and creates
# a commit whose message cog rejects.
#
# Skip bootstrap when `bd` is missing, `bd list` works, or `bd list`
# fails for any reason other than `no beads database found`. With a
# remote, re-running bootstrap plans a clone and dies (`database
# exists`) even though help says an existing database "validates and
# reports status". Missing `bd` used to exit 127 before lefthook ran.
#
# lefthook installs last and owns .git/hooks. mise installs the binary but
# writes no hooks, so this breaks the chicken-and-egg on a fresh clone.
run = [
  "command -v bd >/dev/null || exit 0; if out=$(bd list 2>&1); then exit 0; fi; case \"$out\" in *'no beads database found'*) bd bootstrap --yes;; esac",
  "lefthook install",
]

[tasks.fmt]
description = "Format everything"
run = ["cargo fmt", "dprint fmt", "rumdl fmt ."]

# CI invokes these tasks directly rather than restating their commands, so the
# two cannot drift. `--locked` fails when Cargo.lock is behind Cargo.toml instead
# of silently rewriting it.
[tasks.check]
description = "Static analysis — what CI's static-analysis job runs"
# `--workspace` is insurance, not a requirement: mise runs tasks from the project
# root, where a virtual manifest already selects every member. Run from inside
# `crates/oakum` the default would narrow to that package and skip
# `crates/plan-no-std`, so the flag states the selection rather than inheriting
# it. `--all-targets` then builds the probe's test target, which holds `plan`'s
# own `#[cfg(test)]` module to `no_std`.
# `crates/oakum/tests/no_std_probe.rs` asserts both flags stay here. `cargo fmt`
# needs no such flag; it already spans members, which is what makes the
# inconsistency easy to miss.
#
# shellcheck reads each file's shebang; forcing `--shell=sh` would lint the first
# bash script added as POSIX sh and bury it in false positives.
#
# shellcheck is the command, not an xargs payload: BSD xargs skips the utility
# entirely on empty input. Keep the unquoted `$(git ls-files …)` form so each
# tracked `*.sh` is an argv to shellcheck (hooks under `.beads/hooks/` plus
# `scripts/*.sh`).
run = [
  # `bd init` sets core.hooksPath, which makes git bypass lefthook with no
  # visible symptom: formatting, cog verify, and shellcheck stop running.
  "test -z \"$(git config --get core.hooksPath || true)\" || { echo 'core.hooksPath is set — git is bypassing lefthook; run: git config --unset core.hooksPath'; exit 1; }",
  "cargo fmt --check",
  "cargo clippy --workspace --all-targets --locked -- -D warnings",
  "dprint check",
  "rumdl check .",
  "shellcheck .beads/hooks/* $(git ls-files '*.sh')",
  "actionlint",
]

[tasks.audit]
description = "Dependency advisories, licenses, and sources — what CI's audit job runs"
# Checks and feature selection live in deny.toml. `--workspace` roots the graph
# at every member; without it a member's exclusive dependencies are never seen.
run = "cargo-deny --workspace --locked check all"

[tasks.scan-secrets]
description = "Secret scan over full history — what CI's secret-scan job runs"
# `--redact` because finding output otherwise prints the matched secret in full,
# and in CI that lands in a world-readable log at a stable URL.
run = "gitleaks detect --no-banner --redact --source ."

[tasks.test]
description = "Tests — what CI's tests job runs"
# `--all-targets` silently drops doctests, so the second command is not
# redundant with the first.
#
# `--exclude plan-no-std` because `--all-targets` overrides that package's
# `test = false` and reports `plan`'s suite a second time.
run = [
  "cargo test --workspace --exclude plan-no-std --all-targets --locked",
  "cargo test --workspace --doc --locked",
  "scripts/test-setup-worktree.sh",
]
