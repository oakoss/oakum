# yaml-language-server: $schema=https://raw.githubusercontent.com/jdx/jactionlint/main/schema/jactionlint-config.json
profile: default

# release.yml is autogenerated by cargo-dist (`dist generate`) and protected by
# `allow-dirty = ["ci"]` in dist-workspace.toml; its embedded scripts are not
# ours to restyle. Shellcheck stays on for every hand-written workflow.
paths:
  .github/workflows/release.yml:
    ignore:
      - 'shellcheck reported issue in this script'
      # cargo-dist sets the workflow-level contents permission; moving it per
      # job is lost on regeneration. Matched by message so a job-level grant in
      # a hand-edited job is still reported.
      - 'is granted to every job of the workflow'

# What cargo-dist generates and `dist generate` would restore, scoped to its
# jobs. The jobs oakum edits by hand (host, publish) stay checked.
ignores:
  - rule: unverified-download
    file: .github/workflows/release.yml
    job: plan
    reason: cargo-dist's own installer, pinned to the cargo-dist-version in dist-workspace.toml
  - rule: unverified-download
    file: .github/workflows/release.yml
    job: build-local-artifacts
    reason: cargo-dist installs rustup this way on runners without it
  - rule: template-injection
    file: .github/workflows/release.yml
    job: plan
    reason: cargo-dist interpolates the tag name; the org's Release Tags ruleset lets only org admins and the release App create the tags that start this workflow
