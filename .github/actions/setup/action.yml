name: Setup
description: Install mise and the project toolchain

inputs:
  tools:
    description: >
      Space-separated mise tools to install. Empty installs everything in
      .mise.toml. Jobs needing one tool pass its name so they skip the Rust
      toolchain entirely.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # mise installs the Rust toolchain declared in .mise.toml, components
    # included. A second toolchain action here would leave which `cargo` runs
    # dependent on PATH ordering, and rust-cache keys on whichever rustc it sees.
    - name: Install mise
      uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      with:
        install: true
        install_args: ${{ inputs.tools }}
        cache: true

    # Both steps below assume a Rust toolchain, which a scoped install does not
    # provide.
    - name: Cache cargo
      if: inputs.tools == ''
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

    - name: Toolchain provenance
      if: inputs.tools == ''
      shell: bash
      # Diagnostics only — this must not fail a job. A MISE_RUST_VERSION
      # override replaces the whole tool spec, so `components` from .mise.toml
      # does not survive it and the MSRV toolchain has no clippy. That is fine:
      # the MSRV job runs `cargo check`, never clippy.
      run: |
        echo "cargo -> $(command -v cargo)"
        cargo --version
        rustc --version
        cargo clippy --version || echo "clippy: not installed for this toolchain"
