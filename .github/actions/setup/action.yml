name: Setup
description: Install mise and the project toolchain

inputs:
  tools:
    description: >
      Space-separated mise tools to install. Empty installs everything in
      .mise.toml. Jobs needing one tool pass its name so they skip the Rust
      toolchain entirely.
    required: false
    default: ''
  cache-key:
    description: >
      A cargo cache key shared by jobs that build the same thing. Empty keys
      the cache by job.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # mise installs the Rust toolchain declared in .mise.toml, components
    # included. A second toolchain action here would leave which `cargo` runs
    # dependent on PATH ordering, and rust-cache keys on whichever rustc it sees.
    - name: Install mise
      uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      with:
        install: true
        install_args: ${{ inputs.tools }}
        cache: true

    # Both steps below assume a Rust toolchain, which a scoped install does not
    # provide.
    # Saved from main only: a cache per pull request outgrows GitHub's 10 GB
    # limit and evicts main's, which every pull request restores.
    - name: Cache cargo
      if: inputs.tools == ''
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        shared-key: ${{ inputs.cache-key }}
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Toolchain provenance
      if: inputs.tools == ''
      shell: bash
      # Diagnostics, so a toolchain surprise is visible in the log rather than
      # inferred from a later failure. Every job runs the pinned toolchain now, so
      # clippy is expected to be present and its absence is not tolerated here.
      run: |
        echo "cargo -> $(command -v cargo)"
        cargo --version
        rustc --version
        cargo clippy --version
