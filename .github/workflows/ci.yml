name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden and checkout
        uses: $/.github/actions/harden-checkout

      - name: Oakoss App token
        id: app-token
        if: github.event_name == 'pull_request'
        uses: $/.github/actions/app-token
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          repositories: oakum

      - name: Setup
        uses: $/.github/actions/setup

      # Defined once in .mise.toml so local and CI cannot diverge.
      - name: Check
        run: mise run check

      # Merge and fixup exemptions come from cog.toml, which the commit-msg hook
      # reads too — so local and CI cannot disagree about what is acceptable.
      - name: Commit messages
        if: github.event_name == 'pull_request'
        run: >
          cog check
          ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

      - name: oakum check
        if: >-
          github.event_name == 'pull_request'
          && (github.head_ref != 'oakum/version-packages'
          || github.event.pull_request.head.repo.full_name != github.repository
          || github.event.pull_request.user.login != 'oakoss[bot]'
          || github.event.sender.login != 'oakoss[bot]')
        run: mise run oakum -- check --strict

      - name: oakum ci pr-status
        if: github.event_name == 'pull_request' && (success() || failure())
        continue-on-error: true
        run: mise run oakum -- ci pr-status
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden and checkout
        uses: $/.github/actions/harden-checkout

      - name: Setup
        uses: $/.github/actions/setup

      - name: Test
        run: mise run test

  secret-scan:
    name: Secret Scan
    # The version pull request adds generated changelog prose and version
    # numbers; whatever it contains was scanned when the bump files merged.
    # A branch name does not identify that pull request: `head_ref` carries no
    # owner, and no ruleset protects `oakum/version-packages`. The exemption
    # therefore also requires the same repository, the release app as the pull
    # request's author, and the release app as this event's sender — without the
    # last, anyone with write access could push to the bot's branch and inherit
    # the exemption on the resulting `synchronize` run.
    if: >-
      github.head_ref != 'oakum/version-packages'
      || github.event.pull_request.head.repo.full_name != github.repository
      || github.event.pull_request.user.login != 'oakoss[bot]'
      || github.event.sender.login != 'oakoss[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history, because a secret stays live after the commit that
      # removed it from the tree.
      - name: Harden and checkout
        uses: $/.github/actions/harden-checkout

      # Scoped to gitleaks so this job skips the Rust toolchain. mise resolves it
      # through aqua, which verifies the download's checksum.
      - name: Setup
        uses: $/.github/actions/setup
        with:
          tools: gitleaks

      # A backstop, not the prevention layer — by the time this runs the branch
      # is already pushed and any secret in it already exposed. lefthook's
      # pre-commit gitleaks is what stops it leaving the machine.
      - name: Run gitleaks
        run: mise run scan-secrets

  # Kept in its own file because it needs a trigger this workflow does not have:
  # a weekly cron against a freshly fetched advisory database. Called here so
  # CI Summary gates it on pull requests.
  audit:
    uses: $/.github/workflows/audit.yml

  # Native Windows: cfg(windows) code, NTFS containment, and GIT_SSH/plink.
  windows:
    name: Windows
    # The version pull request's diff is TOML and Markdown; there is no
    # platform-specific behavior in a version string. Same three-part identity
    # test as `secret-scan`.
    if: >-
      github.head_ref != 'oakum/version-packages'
      || github.event.pull_request.head.repo.full_name != github.repository
      || github.event.pull_request.user.login != 'oakoss[bot]'
      || github.event.sender.login != 'oakoss[bot]'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
      MISE_WINDOWS_DEFAULT_INLINE_SHELL_ARGS: bash -c
    defaults:
      run:
        shell: bash
    steps:
      - name: Harden and checkout
        uses: $/.github/actions/harden-checkout

      - name: Setup
        uses: $/.github/actions/setup

      - name: Check
        run: mise run check

      - name: Audit
        run: mise run audit

      - name: Test
        run: mise run test

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [static-analysis, tests, secret-scan, audit, windows]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # Iterates `needs` so any job listed there is gated without editing this
      # step. Note the scope: it gates every job in `needs`, not every job in the
      # workflow — one omitted from `needs` is still ungated.
      #
      # jq writes to a file rather than a process substitution: `< <(...)` puts
      # the producer outside `set -e` and `pipefail`, so a missing jq, malformed
      # JSON, an empty `needs`, or a truncated stream all read as zero rows and
      # exit green while a job is failing.
      - name: Gate on all required jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
          # The jobs whose `if:` skips them on the version pull request, and only
          # there. Empty on every other ref, so a job skipped by a broken
          # condition still fails the gate rather than passing quietly. The three
          # identity terms must match those jobs' conditions exactly.
          SKIPPABLE: >-
            ${{ (github.head_ref == 'oakum/version-packages'
            && github.event.pull_request.head.repo.full_name == github.repository
            && github.event.pull_request.user.login == 'oakoss[bot]'
            && github.event.sender.login == 'oakoss[bot]')
            && 'secret-scan windows' || '' }}
        run: |
          set -euo pipefail

          # Every unexplained abort is silent otherwise: a `jq` that is present but
          # dies leaves an empty log and a nonzero exit, which reads as a clean run
          # to anything triaging by annotation. A refusal below is a verdict, so
          # each one says so rather than collecting a second, contradictory line.
          # Keyed on `verdict`, not on the exit status: an abort is not always
          # nonzero, and a `set -u` violation in a redirection target exits 0,
          # which would otherwise read as a pass. Signals as well as EXIT, because
          # a step killed at `timeout-minutes` or by a cancelled run never reaches
          # an EXIT trap.
          verdict=
          trap 'rc=$?
            if [ -z "$verdict" ]; then
              verdict=aborted
              [ "$rc" -ne 0 ] || rc=1
              echo "::error title=CI gate::gate aborted (exit $rc) before reaching a verdict"
              exit "$rc"
            fi' EXIT INT TERM HUP

          command -v jq >/dev/null || {
            echo "::error title=CI gate::jq not found"
            verdict=reached
            exit 1
          }

          expected=$(printf '%s' "$NEEDS" | jq -r 'length')
          case "$expected" in
            ''|*[!0-9]*)
              echo "::error title=CI gate::could not read the job count from needs"
              verdict=reached
              exit 1
              ;;
          esac
          if [ "$expected" -eq 0 ]; then
            echo "::error title=CI gate::needs is empty — the gate would pass without checking anything"
            verdict=reached
            exit 1
          fi

          printf '%s' "$NEEDS" | jq -r 'to_entries[] | [.key, .value.result] | @tsv' > results.tsv

          {
            echo "## CI Summary"
            echo ""
            echo "| Job | Result |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY" ||
            echo "::warning title=CI gate::step summary unwritable; the verdict is unaffected"

          seen=0
          failed=0
          while IFS=$'\t' read -r job result; do
            seen=$((seen + 1))
            # shellcheck disable=SC2016 # the backticks are markdown, not a subshell
            printf '| %s | `%s` |\n' "$job" "$result" >> "$GITHUB_STEP_SUMMARY" || :
            if [ "$result" = "success" ]; then
              continue
            fi
            if [ -z "$job" ]; then
              echo "::error title=CI gate::empty job name in results"
              failed=1
              continue
            fi
            if [ "$result" = "skipped" ]; then
              case " ${SKIPPABLE-} " in
                *" $job "*)
                  echo "::notice title=CI gate::Job '$job' reported skipped and was excused; the reason was not checked"
                  continue
                  ;;
              esac
            fi
            echo "::error title=CI gate::Job '$job' did not succeed (result: $result)"
            failed=1
          done < results.tsv

          if [ "$seen" -ne "$expected" ]; then
            echo "::error title=CI gate::read $seen of $expected jobs — results were truncated"
            verdict=reached
            exit 1
          fi

          verdict=reached
          exit "$failed"
