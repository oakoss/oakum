# Dogfood via mise. App token on version-pr (bot PRs run CI) and release
# (GITHUB_TOKEN does not start cargo-dist on tag push).
# PR check + pr-status live in ci.yml (gated by CI Summary).
name: oakum

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: oakum-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Harden and checkout
        uses: ./.github/actions/harden-checkout

      - name: Oakoss App token
        id: app-token
        uses: ./.github/actions/app-token
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          repositories: oakum

      - name: Setup
        uses: ./.github/actions/setup

      - name: oakum ci version-pr
        run: mise run oakum -- ci version-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Harden and checkout
        uses: ./.github/actions/harden-checkout

      - name: Oakoss App token
        id: app-token
        uses: ./.github/actions/app-token
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          repositories: oakum
          resolve-identity: true

      - name: Checkout for release push
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup
        uses: ./.github/actions/setup

      - name: Configure git
        run: |
          git config user.name "${{ steps.app-token.outputs.user }}"
          git config user.email "${{ steps.app-token.outputs.email }}"

      - name: oakum release
        run: mise run oakum -- release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
