# Virtual manifest: the shipping crate is `crates/oakum`, and `crates/plan-no-std`
# compiles that crate's own sources under a constraint the main build cannot
# express — see ADR-0024 and its manifest. The layout matches linesmith and
# oakterm, so a reader who knows one oakoss repository knows this one.
#
# ADR-0002 still holds: one shipping crate until a split trigger fires. A probe
# that ships no code of its own is not one.
[workspace]
resolver = "2"
members = ["crates/oakum", "crates/plan-no-std"]

# Inherited by both members with `<key>.workspace = true`. `edition` also feeds a
# line-anchored grep in lefthook's rustfmt hook, which needs it because rustfmt
# reads no manifest; `edition.workspace = true` in a member would hand it an
# empty capture, which is why the value lives here.
#
# `rust-version` equals `.mise.toml`'s pin by decision, not by coincidence — see
# ADR-0025. It is declared so an older toolchain gets `requires rustc 1.97.1`
# rather than a failure deep inside a dependency.
[workspace.package]
authors = ["Jace Babin"]
categories = ["command-line-utilities", "development-tools"]
documentation = "https://docs.rs/oakum"
edition = "2021"
homepage = "https://github.com/oakoss/oakum"
keywords = ["release", "versioning", "changelog", "semver", "monorepo"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/oakoss/oakum"
rust-version = "1.97.1"

[workspace.lints.rust]
# `forbid` so no per-module `#[allow(unsafe_code)]` can reopen it without an
# explicit manifest change.
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# ADR-0002's I/O boundary; `clippy.toml` holds the denylist and the marker rule.
# Declared here rather than as `#![deny]` in a crate root because `[lints]` is
# package-level and so reaches every target, a future `src/bin/*.rs` included.
# Default priority, so it outranks the `-1` groups above.
disallowed_methods = "deny"
