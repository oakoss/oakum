[package]
name = "oakum"
version = "0.0.0"
authors = ["Jace Babin"]
categories = ["command-line-utilities", "development-tools"]
documentation = "https://docs.rs/oakum"
edition = "2021"
homepage = "https://github.com/oakoss/oakum"
keywords = ["release", "versioning", "changelog", "semver", "monorepo"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/oakoss/oakum"
rust-version = "1.91"
description = "A polyglot release tool that derives dependent version bumps from the dependency graph"

[dependencies]
# Cascade decisions compare resolved versions against published ranges. Never
# compare manifest strings — yarn emits `=1.5.0` where pnpm emits `1.5.0`.
semver = "1"
# Workspace discovery asks the package manager and parses its JSON rather than
# reading manifests directly: `cargo metadata` resolves `version.workspace = true`
# and implicit members, which manifest parsing cannot.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Parsing clippy.toml in tests/io_boundary.rs. The substring scan it replaced
# passed vacuously on two states a struct parse rejects: a file that is not
# valid TOML, and one missing `disallowed-methods` entirely. Default features off
# drops `display`, and with it `toml_writer` — the one crate the test never uses;
# it needs `Display` on the error, not a serializer. ADR-0002 excludes
# dev-dependencies from the split trigger, so this is free.
[dev-dependencies]
toml = { version = "1", default-features = false, features = [
  "parse",
  "serde",
] }

[lints]
workspace = true

# The lint values live under `[workspace.lints]` and `[lints] workspace = true`
# above forwards to them; writing the values inline instead is what editors
# reject.
#
# The member compiles this crate's own sources under a constraint the main build
# cannot express; see ADR-0024 and `probes/plan-no-std/Cargo.toml`.
[workspace]
members = ["probes/plan-no-std"]

[workspace.lints.rust]
# `forbid` so no per-module `#[allow(unsafe_code)]` can reopen it without an
# explicit manifest change.
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# ADR-0002's I/O boundary; `clippy.toml` holds the denylist and the marker rule.
# Declared here rather than as `#![deny]` in a crate root because `[lints]` is
# package-level and so reaches every target, a future `src/bin/*.rs` included.
# Default priority, so it outranks the `-1` groups above.
disallowed_methods = "deny"
