[workspace]
members = ["cargo:crates/oakum"]

# Config for 'cargo-dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app. npm is a fetcher, not a bundle —
# ADR-0021; nothing that computes a version may move into its shim.
installers = ["shell", "powershell", "homebrew", "npm"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  # aarch64-pc-windows-msvc dropped to match linesmith: cargo-xwin emits MSVC
  # `/imsvc /path` as two args and cc-rs splits them. Source install via
  # `cargo install oakum` works on Windows ARM64.
]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Homebrew tap repository
tap = "oakoss/homebrew-tap"
# npm scope for the fetcher package (@oakoss/oakum)
npm-scope = "@oakoss"
# Publish the Homebrew formula and npm package on release
publish-jobs = ["homebrew", "npm"]
# Don't run on PRs (CI handles PR validation)
pr-run-mode = "skip"
# Enable GitHub artifact attestations (SLSA provenance)
github-attestations = true
# Embed dependency tree in binaries for security scanning (cargo audit bin)
cargo-auditable = true
# Allow Renovate-style SHA pin updates and the hand-edited publish jobs in the
# generated release.yml without fighting `dist generate --mode=ci`. Remove
# temporarily when regenerating, then run `dprint fmt` — dist emits
# double-quoted YAML and dprint's preferSingle rewrites it — and re-apply the
# hand-edits the publish jobs carry.
allow-dirty = ["ci"]

# Use ubuntu-latest so Renovate doesn't create PRs for runner updates
[dist.github-custom-runners]
global = "ubuntu-latest"

# Pin GitHub Actions to specific commit SHAs (supply-chain hardening, matching
# linesmith). Renovate keeps these current; edit commit SHAs directly here.
[dist.github-action-commits]
"actions/checkout" = "de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7.0.1
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8.0.1
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6" # v4
"actions/setup-node" = "249970729cb0ef3589644e2896645e5dc5ba9c38" # v6
