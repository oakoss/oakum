# The shipping crate. Shared metadata and the lint levels live in the workspace
# root; `readme` inherited from there resolves against the workspace root, which
# is where README.md sits.
[package]
name = "oakum"
version = "0.0.0"
authors.workspace = true
categories.workspace = true
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "A polyglot release tool that derives dependent version bumps from the dependency graph"

[dependencies]
# Config reads stay beneath the repository even if an untrusted checkout races
# path components between validation and open.
cap-std = "4.0.3"
# clap derive for `oakum add`. Default features keep clap's color/help defaults.
clap = { version = "4.6.6", features = ["derive"] }
# Conventional commit parse for `generate` (`okm-j1r`).
# Comparisons are case-insensitive (Feat: ≡ feat:).
git-conventional = "=1.1.0"
# npm / node-semver range grammar for DeclaredRange (ADR-0026). Default features
# off so plan-no-std and this crate unify without pulling `std` into the probe.
js-semver = { version = "0.3", default-features = false }
# CST edits keep comments, CRLF, and the trailing newline (okm-za4).
# `serde_json` pretty-print does not.
jsonc-parser = { version = "0.33", features = ["cst"] }
# Changelog / PR / tag text (ADR-0006). `SemiStrict` is set in `template`.
minijinja = "2.24"
# Cascade decisions compare resolved versions against published ranges. Never
# compare manifest strings — yarn emits `=1.5.0` where pnpm emits `1.5.0`.
semver = "1"
# Workspace discovery asks the package manager and parses its JSON rather than
# reading manifests directly: `cargo metadata` resolves `version.workspace = true`
# and implicit members, which manifest parsing cannot.
serde = { version = "1", features = ["derive"] }
# `pnpm-workspace.yaml` catalogs for `catalog:` resolution (okm-1t8 / ADR-0010).
serde-saphyr = { version = "1.1.0", default-features = false, features = [
  "deserialize",
] }
serde_json = "1"
# Path-linked vs authored `version = "*"` both report `req: "*"` from metadata;
# discovery peeks the dependent Cargo.toml for a `version` key (ADR-0026).
toml = { version = "1", default-features = false, features = [
  "parse",
  "serde",
] }
# Cargo depends on this; `*item = value(v)` still resets decor (okm-299).
toml_edit = "0.25"

# Parsing clippy.toml and the workspace manifests in `tests/`. The substring
# scan this parse replaced passed vacuously on two states a struct parse
# rejects: a file that is not valid TOML, and one missing `disallowed-methods`
# entirely. Default features off drops `display`, and with it `toml_writer` —
# the one crate the tests never use; they need `Display` on the error, not a
# serializer. ADR-0002 excludes dev-dependencies from the split trigger, so this
# is free.
[dev-dependencies]
# knope's bump-file parser; ADR-0005 Confirmation / okm-x4u (tests only).
changesets = "=0.4.0"
# `tests/cargo_lockfile.rs` builds `CargoLockBump` against the same type
# `version` will pass in.
semver = "1"
toml = { version = "1", default-features = false, features = [
  "parse",
  "serde",
] }

# The values live under the root's `[workspace.lints]` so both members carry the
# same set; inline values here would apply to this package alone.
[lints]
workspace = true

[target."cfg(unix)".dependencies]
# A raced FIFO must open nonblocking so it can be rejected by handle metadata.
libc = "0.2"
