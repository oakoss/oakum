[package]
name = "cli"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = { version = "1", optional = true }
core = { path = "../core" }
gitdep = { git = "https://example.invalid/foo.git", package = "foo" }
helper = { path = "../helper" }
json = { package = "serde_json", version = "1" }

[target.'cfg(windows)'.dependencies]
winapi = "0.3"

[build-dependencies]
cc = "1"

[dev-dependencies]
serde = { workspace = true }
