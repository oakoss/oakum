# ADR-0024's confirmation clause, as a build step: the extracted `plan` crate
# compiles under `#![no_std]`. Until extraction `oakum` links `std`, so a `std::`
# path and a std-prelude item both compile there and break only once the crate
# boundary exists. `clippy.toml` catches the I/O paths it enumerates; this
# package catches the rest, prelude items included, which no denylist can name.
#
# It sits beside the shipping crate rather than under a directory of its own
# because the oakoss layout puts every package under `crates/`. `publish = false`
# and a `src/lib.rs` that declares nothing but one `#[path]` are what separate it
# from a crate this project ships; ADR-0002 records why it is not a split.
#
# `mise run check` is what arms it, passing `--workspace --all-targets`; `mise run
# test`'s `--doc` pass compiles it without running anything from it.
# `crates/oakum/tests/no_std_probe.rs` asserts that invocation keeps both flags.
[package]
name = "plan-no-std"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true

# `plan` reaches `semver` and `js-semver` (ADR-0026); the probe must too. Cargo
# unifies features across a workspace build, so the single built copy carries
# `std` regardless of the flags here (ADR-0024); they state intent for the
# extracted manifest. `#![no_std]` in this package's `src/lib.rs` is what holds
# `std` out of `plan`.
[dependencies]
js-semver = { version = "0.3", default-features = false }
semver = { version = "1", default-features = false }

# Keeps `cargo test -p plan-no-std` and a bare `cargo test --workspace` from
# re-running `plan`'s suite. It does not stop `--all-targets`, which builds this
# test target regardless — wanted, since that holds `plan`'s `#[cfg(test)]`
# module to `no_std` too, and why `.mise.toml`'s test task needs `--exclude`.
[lib]
test = false
doctest = false

[lints]
workspace = true
