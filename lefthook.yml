output:
  - failure
  - execution_out
  # Without this, a glob that matches nothing is indistinguishable from a check
  # that passed.
  - skips

# Beads commands invoke .beads/hooks/* directly rather than a local wrapper.
# Those shims are generated by beads (they carry a `v1.2.2` marker), are
# self-contained, and already handle a missing `bd`, the BEADS_HOOK_TIMEOUT
# watchdog with its perl fallback, exit 124/142 for a timeout, and exit 3 for
# an uninitialized database. Copying that logic locally would mean maintaining
# a second copy that drifts when beads updates its own.
#
# `core.hooksPath` must stay unset: beads sets it to .beads/hooks on init,
# which makes git bypass lefthook entirely and silently.
#
# Globs are doubled as `{**/*.x,*.x}` because `**/` requires at least one
# directory segment — a bare `**/*.md` silently skips every root-level file.
#
# One writer per file type, so `parallel: true` is safe: rustfmt owns .rs,
# rumdl owns .md, dprint owns the rest. dprint excludes markdown for exactly
# this reason — two formatters on one file oscillate.

pre-commit:
  parallel: true
  commands:
    fmt-rust:
      glob: '{**/*.rs,*.rs}'
      # rustfmt over `cargo fmt --all` so only staged files are touched.
      # `skip_children` is what makes that true: rustfmt otherwise follows `mod`
      # declarations and rewrites unstaged sibling modules, which `stage_fixed`
      # then leaves dirty in the working tree. The bare `--skip-children` flag
      # is rejected on stable; it has to go through `--config`.
      #
      # The edition is read from Cargo.toml rather than restated: rustfmt does
      # not read the manifest, and a rustfmt.toml value would be overridden by
      # `cargo fmt` in CI while still applying here — divergence, not agreement.
      # The pattern is anchored on the assignment so a workspace manifest picks
      # up `[workspace.package]`'s value instead of the literal text of
      # `edition.workspace = true`. rustfmt exits 1 on an empty value.
      run: >
        rustfmt --config=skip_children=true
        --edition "$(grep -m1 '^edition = "' Cargo.toml | cut -d'"' -f2)"
        {staged_files}
      stage_fixed: true
    fmt-md:
      glob: '{**/*.md,*.md}'
      run: rumdl fmt {staged_files}
      stage_fixed: true
    fmt-data:
      glob: '{**/*.{json,toml,yaml,yml},*.{json,toml,yaml,yml}}'
      # Exclusions live in dprint.json, not here, so `dprint fmt` by hand and
      # the hook agree on what is generated.
      run: dprint fmt {staged_files}
      stage_fixed: true
    shellcheck:
      # The repository's shell scripts are the extensionless .beads/hooks/*;
      # a bare *.sh glob matches nothing here.
      glob: '{**/*.sh,*.sh,.beads/hooks/*}'
      # No --shell override: shellcheck reads each shebang, and forcing sh would
      # lint a bash script as POSIX and bury it in false positives.
      run: shellcheck {staged_files}
    gitleaks:
      # No glob: this runs on every commit, not on a file type. CI's scan is a
      # backstop that fires after the branch is already pushed and the secret
      # already exposed; this is the layer that prevents rather than detects.
      run: gitleaks git --staged --redact --no-banner
    beads:
      env:
        TERM: dumb
      run: .beads/hooks/pre-commit

commit-msg:
  commands:
    conventional-commit:
      # Exemptions live in cog.toml so this and CI's `cog check` share them.
      run: cog verify --file {1}

prepare-commit-msg:
  commands:
    beads:
      env:
        TERM: dumb
      # Only {1} is passed. Git omits the source and sha arguments on a plain
      # commit, and lefthook substitutes an unfilled positional as the literal
      # text "{2}" rather than dropping it — which beads would then read as
      # git's source argument.
      run: .beads/hooks/prepare-commit-msg {1}

post-merge:
  commands:
    beads:
      env:
        TERM: dumb
      run: .beads/hooks/post-merge {1}

post-checkout:
  commands:
    beads:
      env:
        TERM: dumb
      run: .beads/hooks/post-checkout {1} {2} {3}

pre-push:
  parallel: true
  commands:
    beads:
      env:
        TERM: dumb
      run: .beads/hooks/pre-push {1} {2}
